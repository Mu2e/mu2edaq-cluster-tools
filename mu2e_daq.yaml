      - default
      - mu2edaq
      - mu2eshift
      - mu2ecalo
      - mu2edcs
      - mu2etrk

  DCS:
    proxy_jump: mu2egateway01.fnal.gov
    users:
      - mu2edcs
      - mu2eshift
      - mu2ecalo
      - mu2edaq
      - mu2etrk

  Tracker:
    proxy_jump: mu2egateway01.fnal.gov
    users:
      - mu2etrk
      - mu2eshift
      - mu2ecalo
      - mu2edcs
      - mu2edaq

  Calorimeter:
    proxy_jump: mu2egateway01.fnal.gov
    users:
      - mu2ecalo
      - mu2eshift
      - mu2edcs
      - mu2edaq
      - mu2etrk

  Cosmic Ray Veto:
    proxy_jump: mu2egateway01.fnal.gov
    users:
      - default
      - mu2edaq
      - mu2eshift
      - mu2ecalo
      - mu2edcs
      - mu2etrk

  Test Stand:
    proxy_jump: mu2edaq-gateway.fnal.gov
