# lan-scan - Mu2e DAQ public subnet (SITE-ROUTABLE, 131.225.245.0/24)
#
# Use with: lan-scan -c config/lan-scan/lan_scan-mu2edaq.yaml --allow-routable
#
# SITE-ROUTABLE PROFILE. 131.225.245.0/24 is globally routable Fermilab
# address space (it contains mu2egateway01.fnal.gov). A sweep of it can look
# like reconnaissance to the site's network monitoring, so lan-scan refuses
# it unless --allow-routable (or LAN_SCAN_ALLOW_ROUTABLE=1) is given. This
# file deliberately does not set allow_routable: the decision is made per
# run. Only run it if you are authorised to scan this subnet.
#
# The profile is ICMP only (no TCP fallback ports) and uses reduced
# concurrency and rate to keep the probe footprint small.
#
# Keys, environment overrides and precedence are documented in
# config/lan-scan/lan_scan.yaml.example and lan-scan(1).
# Priority: commandline > environment > this file > built-in default.

network: 131.225.245.0/24
timeout: 1.0
workers: 16
rate: 20
no_dns: false
