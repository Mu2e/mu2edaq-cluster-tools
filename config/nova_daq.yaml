# SSH Host Selector — Mu2e host configuration
#
# grouplist   — ordered list of group names for display
# groups      — per-group defaults (users, proxy_jump); host entries override
# hosts       — individual host entries; omit users/proxy_jump to inherit group defaults
#
# Host fields:
#   hostname    — required; address SSH connects to
#   nickname    — display name (defaults to hostname)
#   group       — must match a grouplist entry
#   port        — SSH port (default 22)
#   users       — overrides group users list; first entry is default login
#   proxy_jump  — overrides group proxy_jump; set to null to disable for a host
#
# The special user value "default" resolves to the current OS user.

cache_lifetime: 600   # seconds; set lower (e.g. 60) for a busy cluster

grouplist:
  - Gateways
  - VNC
  - DAQ Control
  - Farm FarDet
  - Farm NearDet
  - Roc-West Control Room
  - Timing Controls

groups:
  Gateways:
    users:
      - novadaq
      - novaraw
      - novadcs
      - novacr01
      - novacr02
      - novacr03
      - novacr04
    # no proxy_jump — gateways are directly reachable
  VNC:
    proxy_jump: novadaq-far-gateway-01.fnal.gov
    users:
      - default
      - novacr01
      - novacr02
      - novacr03
      - novacr04
      - novadaq
      - novaraw
      - novadcs
  Farm FarDet:
    proxy_jump: novadaq-far-gateway-01.fnal.gov
    users:
      - default
      - novadaq
      - novaraw
      - novadcs
  Farm NearDet:
    proxy_jump: novadaq-near-gateway-01.fnal.gov
    users:
      - default
      - novadaq
      - novaraw
      - novadcs

  DAQ Control:
    proxy_jump: novadaq-far-gateway-01.fnal.gov
    users:
      - novadaq
      - novaraw
      - novadcs
  Roc-West Control Room:
    proxy_jump: novagpvm03.fnal.gov
    users:
      - novadaq
      - novaraw
      - mu2eshift
      - mu2ecalo
      - mu2edcs
      - mu2etrk

  Timing Controls:
    proxy_jump: mu2egateway01.fnal.gov
    users:
      - default
      - mu2edaq
      - mu2eshift
      - mu2ecalo
      - mu2edcs
      - mu2etrk

  DCS:
    proxy_jump: mu2egateway01.fnal.gov
    users:
      - mu2edcs
      - mu2eshift
      - mu2ecalo
      - mu2edaq
      - mu2etrk
  
hosts:
  # -- VNC Servers (for remote desktop ---------------------------------------
  - nickname: "VNC Server 01"
    hostname: novadaq-far-mgr-02.fnal.gov
    group: VNC
    users:
      - novacr01
  - nickname: "VNC Server 02"
    hostname: novadaq-far-mgr-02.fnal.gov
    group: VNC
    users:
      - novacr02
  - nickname: "VNC Server 03"
    hostname: novadaq-far-mgr-02.fnal.gov
    group: VNC
    users:
      - novacr03
  - nickname: "VNC Server 04"
    hostname: novadaq-far-mgr-02.fnal.gov
    group: VNC
    users:
      - novacr04
  
