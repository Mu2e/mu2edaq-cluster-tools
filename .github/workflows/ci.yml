name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    name: "Python ${{ matrix.python-version }} / ${{ matrix.os }}${{ matrix.experimental && ' (experimental)' || '' }}"
    runs-on: ${{ matrix.os }}
    # Windows is declared in the pyproject classifiers but the suite has never
    # been run there (e.g. symlink and POSIX-path assumptions); its jobs report
    # but do not fail the workflow until they are known to pass.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.9 is requires-python's floor and the AlmaLinux 9 system Python.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        experimental: [false]
        include:
          - os: windows-latest
            python-version: "3.9"
            experimental: true
          - os: windows-latest
            python-version: "3.12"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest
